services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-user-service
      - setting-service
      - produk-service
      - keuangan-service
      - client-service
      - delete-service
      - teacher-service

  auth-user-service:
    build: ./services/auth-user-service-go
    environment:
      - SERVICE_PORT=3000
      - DATABASE_URL=postgres://root:armagedon25@auth-user-db:5432/auth_db
      - JWT_SECRET=supersecretjwt
    depends_on:
      - auth-user-db

  setting-service:
    build: ./services/setting-service
    environment:
      - SERVICE_PORT=3000
      - DATABASE_URL=postgres://root:armagedon25@setting-db:5432/setting_db
    depends_on:
      - setting-db

  produk-service:
    build: ./services/produk-service
    environment:
      - SERVICE_PORT=3000
      - DATABASE_URL=postgres://root:armagedon25@produk-db:5432/produk_db
    depends_on:
      - produk-db

  keuangan-service:
    build: ./services/keuangan-service
    environment:
      - SERVICE_PORT=3000
      - DATABASE_URL=postgres://root:armagedon25@keuangan-db:5432/keuangan_db
    depends_on:
      - keuangan-db

  client-service:
    build: ./services/client-service
    environment:
      - SERVICE_PORT=3000
      - DATABASE_URL=postgres://root:armagedon25@client-db:5432/client_db
    depends_on:
      - client-db

  delete-service:
    build: ./services/delete-service
    environment:
      - SERVICE_PORT=3000
      - DATABASE_URL=postgres://root:armagedon25@delete-db:5432/delete_db
    depends_on:
      - delete-db

  teacher-service:
    build: ./services/teacher-service
    environment:
      - SERVICE_PORT=3000
      - DATABASE_URL=postgres://root:armagedon25@teacher-db:5432/teacher_db
    depends_on:
      - teacher-db

  # Migrator untuk menjalankan seluruh file SQL di backend/migrations
  db-migrator:
    image: postgres:16-alpine
    depends_on:
      - auth-user-db
      - setting-db
      - produk-db
      - keuangan-db
      - client-db
      - delete-db
    volumes:
      - ./migrations:/migrations
    entrypoint: ["/bin/sh","-c"]
    command: >
      PGPASSWORD=armagedon25 psql -h auth-user-db -U root -d auth_db -f /migrations/auth.sql &&
      PGPASSWORD=armagedon25 psql -h setting-db -U root -d setting_db -f /migrations/setting.sql &&
      PGPASSWORD=armagedon25 psql -h produk-db -U root -d produk_db -f /migrations/produk.sql &&
      PGPASSWORD=armagedon25 psql -h keuangan-db -U root -d keuangan_db -f /migrations/keuangan.sql &&
      PGPASSWORD=armagedon25 psql -h client-db -U root -d client_db -f /migrations/client.sql &&
      PGPASSWORD=armagedon25 psql -h delete-db -U root -d delete_db -f /migrations/delete.sql

  auth-user-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=armagedon25
    volumes:
      - auth_user_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  setting-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=setting_db
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=armagedon25
    volumes:
      - setting_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  produk-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=produk_db
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=armagedon25
    volumes:
      - produk_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  keuangan-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=keuangan_db
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=armagedon25
    volumes:
      - keuangan_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  client-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=client_db
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=armagedon25
    volumes:
      - client_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"

  delete-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=delete_db
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=armagedon25
    volumes:
      - delete_data:/var/lib/postgresql/data
    ports:
      - "5438:5432"

  teacher-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=teacher_db
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=armagedon25
    volumes:
      - teacher_data:/var/lib/postgresql/data
    ports:
      - "5439:5432"

networks:
  default:
    name: gonex-net

volumes:
  auth_user_data:
  setting_data:
  produk_data:
  keuangan_data:
  client_data:
  delete_data:
  teacher_data: