server {
  listen 80;
  server_name _;

  # Common proxy headers
  set $upstream_host "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Auth/User service routes
  location ~ ^/(users|roles|roles-user|has-permissions|permissions)(/|$) {
    proxy_pass http://auth-user-service:3000;
  }
  location ~ ^/(auth)(/|$) {
    proxy_pass http://auth-user-service:3000;
  }

  # Setting service routes
  location ~ ^/(setting|settings|companies|jabatan|jabatan-presensi)(/|$) {
    proxy_pass http://setting-service:3000;
  }

  # Produk service routes
  location ~ ^/(produk|gudang|mutasi|posisi|rak|recommendations|maintenance|assets|category-asset|category-produk|pembelian)(/|$) {
    proxy_pass http://produk-service:3000;
  }

  # Keuangan service routes
  location ~ ^/(payment|kas|arus|keluar|masuk|rekening)(/|$) {
    proxy_pass http://keuangan-service:3000;
  }

  # Client service routes
  location ~ ^/(presensi|absences|activities|check-in|setting-presensi)(/|$) {
    proxy_pass http://client-service:3000;
  }

  # Delete service routes
  location ~ ^/(deletion-logs)(/|$) {
    proxy_pass http://delete-service:3000;
  }

  # Health for gateway
  location = /health {
    return 200 '{"status":"ok","service":"gateway"}';
  }

  # Default
  location / {
    return 404;
  }
}